version: "3.9"

services:
  # ── Microsserviço de IA: FastAPI ──────────────────────────────────────────
  # Dados, auth e banco vivem no Supabase (nuvem). O único serviço que roda
  # localmente é a IA da Teca.
  fastapi:
    build:
      context: ./backend/fastapi
      dockerfile: Dockerfile
    container_name: aulateca_fastapi
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,http://localhost:8080}
    restart: unless-stopped
