services:
  # Microsserviço de IA da Teca. Dados/auth ficam no Supabase; este serviço só
  # gera texto com Gemini/OpenAI e exige JWT do Supabase para ser usado.
  - type: web
    name: aulateca-fastapi
    runtime: python
    plan: free
    rootDir: backend/fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # JWT Secret do projeto Supabase (Dashboard → Settings → API → JWT Secret).
      # Usado para validar o token do usuário logado antes de gastar IA.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://aulateca.com.br,https://www.aulateca.com.br
